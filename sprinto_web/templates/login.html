<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Sprinto outbound agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --n950:#081530; --n900:#0F2547; --n600:#35588F; --n200:#C9D4E7; --n50:#F5F7FB; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--n900); color:var(--n900);
         font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px }
  form { background:#fff; border-radius:14px; padding:28px; width:100%; max-width:360px }
  .mark { width:34px; height:34px; border-radius:9px; background:var(--n900); color:#fff; display:grid; place-items:center; font-weight:800; margin-bottom:14px }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em } p { color:var(--n600); margin:0 0 18px; font-size:13.5px }
  input { width:100%; box-sizing:border-box; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--n200); background:#fff; color:var(--n900) }
  input:focus { outline:2px solid var(--n900); outline-offset:1px }
  button { margin-top:12px; width:100%; font:inherit; font-weight:600; padding:10px; border-radius:8px; border:0; background:var(--n900); color:#fff; cursor:pointer }
  button:hover { background:var(--n950) }
  .err { color:var(--n900); font-weight:600; font-size:13.5px; margin-top:10px }
</style></head>
<body>
<form method="post" action="/login">
  <div class="mark">S</div>
  <h1>Sprinto outbound agent</h1>
  <p>Demo dashboard. Enter the access password.</p>
  <input type="hidden" name="next" value="{{ next }}">
  <input type="password" name="password" placeholder="Password" autofocus required autocomplete="current-password">
  <button type="submit">Sign in</button>
  {% if error %}<div class="err">! Wrong password.</div>{% endif %}
</form>
</body></html>
